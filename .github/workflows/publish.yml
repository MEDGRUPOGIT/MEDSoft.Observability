name: publish

# Publica os pacotes no GitHub Packages (nuget.pkg.github.com/MEDGRUPOGIT) ao
# criar uma tag vX.Y.Z. Versao vem do Directory.Build.props (bump = editar
# <Version> la + taggear; lockstep — todos os pacotes do repo saem juntos, na
# mesma versao). Apos o push, o mesmo artefato vai pro feed S3 interno (Sleet,
# ADR-044 do gitops-platform) — leitura sem credencial por rede interna, o
# caminho dos devs. Publish parcial (falha entre pushes) = RE-RUN, nunca
# re-tag: --skip-duplicate/--skip-existing tornam o job idempotente.
on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # OIDC pro role do feed S3 (Sleet)
    steps:
      - uses: actions/checkout@v4

      # Guard (auditoria 2026-07-26, achado A10): a tag DEVE casar com o
      # <Version> do Directory.Build.props. Sem isto, taggear v0.4.0 com props
      # 0.3.0 republicaria 0.3.0 e o --skip-duplicate engoliria EM SILENCIO,
      # com o run verde — bump fantasma que ninguem percebe.
      - name: Valida tag == <Version> (Directory.Build.props, lockstep)
        if: github.event_name == 'push'
        run: |
          V=$(grep -oP '(?<=<Version>)[^<]+' Directory.Build.props)
          if [ "v$V" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME nao casa com <Version>$V</Version> do Directory.Build.props — bump o props ou re-tagueie."
            exit 1
          fi
          # Anti-divergencia: <Version> num csproj VENCE o props EM SILENCIO
          # (project body avalia depois do import). Um csproj com Version
          # esquecida = pacote publicado com versao velha + --skip-duplicate
          # engolindo — o bump fantasma de novo, agora so em UM dos pacotes.
          if grep -rl '<Version>' src --include='*.csproj'; then
            echo "::error::csproj redeclara <Version> — a versao mora SO no Directory.Build.props (lockstep)."
            exit 1
          fi
          echo "ok: tag $GITHUB_REF_NAME == props $V, nenhum csproj diverge"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore + Build
        run: dotnet build -c Release src/MEDSoft.Observability/MEDSoft.Observability.csproj

      - name: Pack
        run: dotnet pack -c Release --no-build -o ./nupkg src/MEDSoft.Observability/MEDSoft.Observability.csproj

      - name: Push (GitHub Packages, skip se versao ja existe)
        run: >
          dotnet nuget push "./nupkg/*.nupkg"
          --source "https://nuget.pkg.github.com/MEDGRUPOGIT/index.json"
          --api-key ${{ secrets.GITHUB_TOKEN }}
          --skip-duplicate

      - name: AWS creds (OIDC, feed S3)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::733650068546:role/gha-medgrupo-nuget-feed-publisher
          aws-region: sa-east-1

      - name: Push ao feed S3 interno (Sleet)
        run: |
          dotnet tool install -g sleet
          cat > sleet.json <<'JSON'
          {
            "sources": [
              {
                "name": "s3feed",
                "type": "s3",
                "bucketName": "medgrupo-nuget-feed",
                "region": "sa-east-1",
                "path": "https://medgrupo-nuget-feed.bucket.vpce-0268cde3e180e47d0-ufw5d4nc.s3.sa-east-1.vpce.amazonaws.com/"
              }
            ]
          }
          JSON
          sleet init --config sleet.json --source s3feed || true
          sleet push ./nupkg --config sleet.json --source s3feed --skip-existing
